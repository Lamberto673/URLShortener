services:
  web:
    build:
      context: .
      dockerfile: .dockerfile
    ports:
      - "8081:8081"
    environment:
      - ADDR=:8081
      - REDIS_ADDR=:6379
      - DATABASE_URL=postgres://urlshort:urlshort@postgres:5432/urlshort?sslmode=disable
    depends_on:
      - postgres
      - redis
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=urlshort
      - POSTGRES_PASSWORD=urlshort
      - POSTGRES_DB=urlshort
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pg_data:
